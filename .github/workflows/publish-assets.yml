name: Build Docs Assets for Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "package.json"
      - ".github/workflows/publish-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies on GitHub runner, NOT the server
        run: npm install --no-audit --no-fund
      - name: Build static site
        run: npm run docs:build
      - name: Export compiled assets to cf-dist branch
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan cf-dist
          git rm -rf .
          git add -f docs/.vitepress/dist
          git commit -m "build: publish VitePress assets from ${GITHUB_SHA}"
          git push --force origin HEAD:cf-dist
