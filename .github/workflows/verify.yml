name: Verify learning handbook

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    name: Documentation build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install docs dependencies
        run: npm install --no-audit --no-fund
      - name: Build VitePress
        shell: bash
        run: |
          set -o pipefail
          npm run docs:build 2>&1 | tee /tmp/vitepress-build.log || {
            echo "::error title=VitePress build diagnostics::$(tail -n 25 /tmp/vitepress-build.log | tr '\n' ' ' | cut -c1-3500)"
            exit 1
          }

  contracts:
    name: Foundry build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/foundry
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Compile contracts
        run: forge build
      - name: Test contracts
        run: forge test -vv
